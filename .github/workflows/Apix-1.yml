name: APiX TV GitHub Engine 4K

on:
  workflow_dispatch: # التشغيل اليدوي بضغطة زر

jobs:
  broadcaster:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Arsenal (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Launch Ultimate 4K Core
        env:
          # سحب الروابط من أسرار المستودع
          CH1_URL: ${{ secrets.CH1_URL }}
          CH1_RTMP: ${{ secrets.CH1_RTMP }}
        run: |
          echo "🚀 Starting 4K APiX TV Engine on GitHub Actions..."
          
          ffmpeg -nostdin -hide_banner \
          -err_detect ignore_err \
          -headers "Cache-Control: no-cache, no-store\r\nPragma: no-cache\r\n" \
          -reconnect 1 -reconnect_at_eof 1 -reconnect_streamed 1 -reconnect_delay_max 2 \
          -i "$CH1_URL" \
          -vf "scale=3840:2160,fps=30" \
          -c:v libx264 -preset ultrafast -profile:v high -b:v 12000k -maxrate 14000k -bufsize 24000k \
          -c:a aac -b:a 128k \
          -max_muxing_queue_size 8192 -f flv -flvflags no_duration_filesize \
          "$CH1_RTMP"
