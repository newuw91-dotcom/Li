name: APiX TV GitHub Engine 1080p HDR

on:
  workflow_dispatch:

jobs:
  broadcaster:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Arsenal (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Launch Ultimate 1080p Core
        env:
          CH1_URL: ${{ secrets.CH1_URL }}
          CH1_RTMP: ${{ secrets.CH1_RTMP }}
        run: |
          echo "🚀 Starting 1080p APiX TV Engine on GitHub Actions (With Fake-HDR & Sharpness)..."
          
          while true; do
            echo "🔄 (Re)Starting stream..."
            ffmpeg -nostdin -hide_banner \
            -err_detect ignore_err \
            -headers "Cache-Control: no-cache, no-store\r\nPragma: no-cache\r\n" \
            -reconnect 1 -reconnect_at_eof 1 -reconnect_streamed 1 -reconnect_delay_max 2 \
            -i "$CH1_URL" \
            -vf "scale=1920:1080:flags=lanczos,eq=saturation=1.35:contrast=1.15:brightness=0.02,unsharp=5:5:0.8,fps=30" \
            -c:v libx264 -preset ultrafast -profile:v high -b:v 6000k -maxrate 7000k -bufsize 14000k \
            -c:a aac -b:a 128k \
            -max_muxing_queue_size 8192 -f flv -flvflags no_duration_filesize \
            "$CH1_RTMP"
            
            echo "⚠️ Stream interrupted! Restarting in 3 seconds to keep action alive..."
            sleep 3
          done
