name: APiX TV GitHub Engine

on:
  workflow_dispatch: # هذا الأمر يسمح لك بتشغيل البث يدوياً متى أردت بضغطة زر

jobs:
  broadcaster:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Arsenal (FFmpeg & Streamlink)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip3 install streamlink

      - name: Launch Ultimate Mobile Core (Unmodified)
        env:
          CH1_URL: ${{ secrets.CH1_URL }}
          CH1_RTMP: ${{ secrets.CH1_RTMP }}
        run: |
          echo "🚀 Starting APiX TV Engine on GitHub Actions (Trusted Network)..."
          
          # الكود الخاص بك منسوخ حرفياً كما طلبت، مع استخدام المتغيرات السرية للروابط
          streamlink --http-header "User-Agent=And\$MyTV" --stream-segment-threads 4 --stream-segment-timeout 10 --stream-segment-attempts 10 --hls-live-edge 15 --ringbuffer-size 64M --stdout "$CH1_URL" best | ffmpeg -nostdin -hide_banner -re -thread_queue_size 1024 -i pipe:0 -c:v copy -c:a aac -b:a 128k -max_muxing_queue_size 4096 -f flv "$CH1_RTMP"
